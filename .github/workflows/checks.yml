name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: pip install mcp==1.30.0
      - run: python tests/check_mcp.py
      - run: python -m py_compile receiver.py observe.py uxplay_source.py hardware/tools/hybrid_control.py tools/airtype.py tools/airtype_input.py tools/action_runtime.py tools/operation_journal.py tools/observe_mcp.py
      - run: bash -n hardware/build.sh
      - run: c++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -Ihardware/tests/hybrid hardware/tests/hybrid/test_absolute.cpp -o /tmp/absolute-test && /tmp/absolute-test
